[package]
name = "nym_flickr_cast"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "Browse Flickr albums in a web app and cast them as a slideshow to Google Cast devices"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/nymankla/NymFlickrCast"
authors = ["Klas Nyman"]

[dependencies]
form_urlencoded = "1.2.2"
mdns-sd = "0.21.5"
rust_cast = { version = "0.21.0", features = ["thread_safe"] } # Send sessions, so a stop can be given up on
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"

[profile.release]
# Small exe (5.6 MB -> 3.1 MB): the app mostly waits on the network, so size beats raw CPU speed.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind" (abort would save ~0.7 MB): cast_worker and the HTTP workers catch panics and keep running.

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints aimed at library APIs, not a single binary.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Lock guards in `if let` / `match` scrutinees are short-lived here on purpose.
significant_drop_in_scrutinee = "allow"
# Selected restriction and nursery lints.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
str_to_string = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
use_self = "warn"
equatable_if_let = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
