[package]
name = "nym_flickr_cast"
version = "0.6.1"
edition = "2024"
description = "Browse Flickr albums in a web app and cast them as a slideshow to Google Cast devices"
license = "MIT"
readme = "readme.md"
authors = ["Klas Nyman"]

[dependencies]
mdns-sd = "0.21.5"
rust_cast = "0.21.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "2", features = ["json"] }
url = "2"
