<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NymFlickrCast</title>
<style>
  :root { --bg:#0b0b10; --panel:#16161d; --panel2:#20202a; --line:#2b2b36; --text:#f3f3f6; --muted:#9b9bab;
          --accent:#ff0084; --blue:#0063dc; --glow:0 0 0 3px #ff008455; --radius:14px; color-scheme:dark }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background:radial-gradient(900px 500px at 10% -10%, #0063dc22, transparent 60%),
                    radial-gradient(800px 500px at 100% 0%, #ff008420, transparent 60%), var(--bg) fixed }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center;
           padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top));
           background:#16161dcc; backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
           border-bottom:1px solid var(--line) }
  /* Flickr's blue and pink dots */
  header h1 { font-size:19px; font-weight:800; letter-spacing:-.02em; margin:0; white-space:nowrap; display:flex; align-items:center }
  header h1::before { content:''; width:11px; height:11px; border-radius:50%; background:var(--blue); box-shadow:14px 0 var(--accent); margin-right:24px }
  header h1 b { background:linear-gradient(90deg, var(--blue), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent }
  form { display:flex; gap:6px; flex:0 1 auto; min-width:0 }
  input, button { font:inherit; font-size:16px; min-height:40px; touch-action:manipulation; color:var(--text); background:var(--panel2);
                  border:1px solid var(--line); border-radius:10px; padding:6px 12px; transition:border-color .15s, background .15s, box-shadow .15s, transform .1s }
  input { min-width:0; flex:0 1 240px }
  input:focus { outline:none; border-color:var(--accent); box-shadow:var(--glow) }
  button { cursor:pointer; font-weight:600 }
  button:hover { border-color:#4a4a5a; background:#2a2a36 }
  button:active { transform:scale(.97) }
  button:focus-visible { outline:none; box-shadow:var(--glow) }
  #userForm button, #play, #keyForm button { background:linear-gradient(135deg, var(--accent), #c4006a); border-color:transparent; color:#fff }
  #userForm button:hover, #play:hover, #keyForm button:hover { filter:brightness(1.12) }
  #status { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0 }
  #castBtn { display:flex; padding:8px; background:none; border:none; margin-left:auto; border-radius:50% }
  #castBtn:hover { background:var(--panel2) }
  #castBtn svg { width:26px; height:26px; fill:var(--muted); transition:fill .2s }
  #castBtn.on svg { fill:var(--accent); filter:drop-shadow(0 0 6px var(--accent)) }
  #castBtn:disabled { opacity:.35; cursor:default; background:none }
  #menu { position:absolute; right:8px; top:100%; margin-top:6px; width:min(290px, calc(100vw - 16px)); background:#1c1c25ee;
          backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:var(--radius);
          padding:6px; box-shadow:0 16px 40px #000c }
  #menu button { display:block; min-height:44px; width:100%; text-align:left; margin:2px 0; background:none; border-color:transparent; border-radius:10px }
  #menu button:hover { background:#ff008422; color:#fff }
  #menu p { margin:8px 12px; color:var(--muted) }
  main { padding:20px; max-width:1600px; margin:0 auto }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:18px }
  .bar h2 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0 }
  .delay { color:var(--muted); white-space:nowrap }
  #delay { flex:none; width:5.5em; margin:0 4px }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)) }
  .card { position:relative; background:var(--panel); border-radius:var(--radius); overflow:hidden; cursor:pointer; border:1px solid var(--line);
          padding:0; text-align:left; font-weight:400; box-shadow:0 2px 8px #0006; transition:transform .25s, box-shadow .25s, border-color .25s }
  .card img { display:block; width:100%; aspect-ratio:1; object-fit:cover; background:var(--panel2); transition:transform .5s }
  .card:hover, .card:focus-visible { border-color:var(--accent); box-shadow:0 14px 32px #000a, 0 0 0 1px var(--accent); background:var(--panel) }
  .card div { padding:10px 12px 12px; font-weight:650 }
  .card small { color:var(--muted); font-weight:400 }
  .photos { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px }
  .photos .card { border-radius:8px }
  #msg { color:var(--muted); text-align:center; margin:48px 0; font-size:17px }
  @media (prefers-reduced-motion:no-preference) {
    .card:hover { transform:translateY(-4px) }
    .card:hover img { transform:scale(1.06) }
  }
  #viewer { position:fixed; inset:0; touch-action:pan-y pinch-zoom; z-index:10; background:radial-gradient(circle at 50% 40%, #16161d, #000 70%);
            display:flex; align-items:center; justify-content:center }
  #viewer img { max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 20px 60px #000 }
  #viewer button { background:#0008; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-color:#ffffff22 }
  #viewer button:hover { background:#ff008488 }
  #viewer .ctl { position:absolute; display:flex; gap:8px; top:max(12px, env(safe-area-inset-top)); right:12px }
  #viewer .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:30px; width:52px; height:52px; padding:0; border-radius:50% }
  #viewer .nav:active { transform:translateY(-50%) scale(.94) }
  #viewer .count { position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); font-size:13px;
                   padding:4px 12px; border-radius:99px; background:#0008; color:#ddd; font-variant-numeric:tabular-nums }
  @media (max-width:600px) {
    main { padding:12px }
    .grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px }
    .photos { grid-template-columns:repeat(auto-fill, minmax(95px, 1fr)); gap:5px }
    form { order:3; flex:1 1 100% } input { flex:1 }
    .bar { flex-wrap:wrap } .bar h2 { flex-basis:100%; order:-1 }
  }
  #keyForm { display:block; max-width:540px; margin:40px auto; background:var(--panel); padding:22px 24px; border-radius:var(--radius);
             border:1px solid var(--line); box-shadow:0 0 0 1px #ff008433, 0 20px 50px #000a }
  #keyForm h2 { margin:0 0 8px; font-size:20px }
  #keyForm input { width:100%; margin:10px 0 }
  #keyForm a { color:var(--accent) }
  #keyMsg { color:var(--accent); min-height:1.4em; margin:6px 0 0 }
  [hidden] { display:none !important }
</style>
</head>
<body>
<header>
  <h1>Nym<b>Flickr</b>Cast</h1>
  <form id="userForm"><input id="user" placeholder="Flickr username or NSID" aria-label="Flickr user"><button>Load</button></form>
  <span id="status"></span>
  <button id="castBtn" title="Cast" aria-label="Cast to a device" disabled>
    <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
  </button>
  <div id="menu" hidden></div>
</header>
<main>
  <form id="keyForm" hidden>
    <h2>Flickr API key needed</h2>
    <p>No valid key was found in <code>secrets/flickrkey.txt</code>. Paste your Flickr API key (the 32-character "Key", not the secret).
      Get one at <a href="https://www.flickr.com/services/apps/create/" target="_blank" rel="noopener">flickr.com/services/apps/create</a>.</p>
    <input id="key" autocomplete="off" spellcheck="false" placeholder="0123456789abcdef0123456789abcdef" aria-label="Flickr API key">
    <button>Save key</button>
    <p id="keyMsg" role="status"></p>
  </form>
  <div class="bar" id="albumBar" hidden><button id="back">← Albums</button><h2 id="albumTitle"></h2><button id="play">▶ View slideshow</button>
    <label class="delay">Delay<input id="delay" type="number" min="2" max="3600" step="1" inputmode="numeric" value="4">s</label></div>
  <p id="msg">Enter a Flickr username to see the albums.</p>
  <div id="grid" class="grid"></div>
</main>
<div id="viewer" hidden>
  <img id="big" alt="">
  <button class="nav" id="prev" style="left:12px" aria-label="Previous">‹</button>
  <button class="nav" id="next" style="right:12px" aria-label="Next">›</button>
  <div class="ctl"><button id="slide">▶ Play</button><button id="full" title="Full screen (F)" aria-label="Full screen">⛶</button><button id="close">✕ Close</button></div>
  <div class="count" id="count"></div>
</div>
<script src="/ui.js"></script>
</body>
</html>
