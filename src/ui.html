<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NymFlickrCast</title>
<style>
  :root { --bg:#111; --panel:#1c1c1e; --line:#2c2c2e; --text:#eee; --muted:#999; --accent:#ff0084; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line) }
  header h1 { font-size:17px; margin:0; white-space:nowrap }
  header h1 b { color:var(--accent) }
  form { display:flex; gap:6px; flex:1; min-width:0 }
  input, button { font:inherit; font-size:16px; min-height:40px; touch-action:manipulation; color:var(--text); background:#2c2c2e; border:1px solid #3a3a3c; border-radius:6px; padding:6px 10px }
  input { min-width:0; flex:0 1 240px }
  button { cursor:pointer }
  button:hover { border-color:#666 }
  #status { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0 }
  form { flex:0 1 auto }
  #castBtn { display:flex; padding:8px; background:none; border:none; margin-left:auto }
  #castBtn svg { width:26px; height:26px; fill:var(--muted) }
  #castBtn.on svg { fill:var(--accent) }
  #castBtn:disabled { opacity:.35; cursor:default }
  #menu { position:absolute; right:8px; top:100%; width:min(280px, calc(100vw - 16px)); background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:6px; box-shadow:0 8px 24px #000a }
  #menu button { display:block; min-height:44px; width:100%; text-align:left; margin:2px 0; background:none; border-color:transparent }
  #menu button:hover { background:#2c2c2e }
  #menu p { margin:6px 10px; color:var(--muted) }
  main { padding:16px }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:14px }
  .bar h2 { margin:0; font-size:18px }
  .delay { color:var(--muted); white-space:nowrap }
  #delay { flex:none; width:5.5em; margin:0 4px }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)) }
  .card { background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid transparent; padding:0; text-align:left }
  .card:hover, .card:focus-visible { border-color:var(--accent) }
  .card img { display:block; width:100%; aspect-ratio:1; object-fit:cover; background:#222 }
  .card div { padding:8px 10px }
  .card small { color:var(--muted) }
  .photos { grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:6px }
  .photos .card { border-radius:4px }
  #msg { color:var(--muted) }
  #viewer { position:fixed; inset:0; touch-action:pan-y pinch-zoom; z-index:10; background:#000; display:flex; align-items:center; justify-content:center }
  #viewer img { max-width:100%; max-height:100%; object-fit:contain }
  #viewer .ctl { position:absolute; display:flex; gap:8px; top:max(12px, env(safe-area-inset-top)); right:12px }
  #viewer .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:28px; min-width:48px; min-height:64px; background:#0008 }
  #viewer .count { position:absolute; bottom:10px; right:14px; color:var(--muted); font-size:13px }
  @media (max-width:600px) {
    main { padding:12px }
    .grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)) }
    .photos { grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)) }
    form { order:3; flex:1 1 100% } input { flex:1 }
    .bar { flex-wrap:wrap }
  }
  #keyForm { display:block; max-width:520px; margin:24px auto; background:var(--panel); padding:16px 20px; border-radius:8px }
  #keyForm h2 { margin:0 0 8px; font-size:18px }
  #keyForm input { width:100%; margin:8px 0 }
  #keyForm a { color:var(--accent) }
  #keyMsg { color:var(--accent); min-height:1.4em; margin:6px 0 0 }
  [hidden] { display:none !important }
</style>
</head>
<body>
<header>
  <h1>Nym<b>Flickr</b>Cast</h1>
  <form id="userForm"><input id="user" placeholder="Flickr username or NSID" aria-label="Flickr user"><button>Load</button></form>
  <span id="status"></span>
  <button id="castBtn" title="Cast" aria-label="Cast to a device" disabled>
    <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
  </button>
  <div id="menu" hidden></div>
</header>
<main>
  <form id="keyForm" hidden>
    <h2>Flickr API key needed</h2>
    <p>No valid key was found in <code>secrets/flickrkey.txt</code>. Paste your Flickr API key (the 32-character "Key", not the secret).
      Get one at <a href="https://www.flickr.com/services/apps/create/" target="_blank" rel="noopener">flickr.com/services/apps/create</a>.</p>
    <input id="key" autocomplete="off" spellcheck="false" placeholder="0123456789abcdef0123456789abcdef" aria-label="Flickr API key">
    <button>Save key</button>
    <p id="keyMsg" role="status"></p>
  </form>
  <div class="bar" id="albumBar" hidden><button id="back">← Albums</button><h2 id="albumTitle"></h2><button id="play">▶ View slideshow</button>
    <label class="delay">Delay<input id="delay" type="number" min="2" max="3600" step="1" inputmode="numeric" value="8">s</label></div>
  <p id="msg">Enter a Flickr username to see the albums.</p>
  <div id="grid" class="grid"></div>
</main>
<div id="viewer" hidden>
  <img id="big" alt="">
  <button class="nav" id="prev" style="left:12px" aria-label="Previous">‹</button>
  <button class="nav" id="next" style="right:12px" aria-label="Next">›</button>
  <div class="ctl"><button id="slide">▶ Play</button><button id="full" title="Full screen (F)" aria-label="Full screen">⛶</button><button id="close">✕ Close</button></div>
  <div class="count" id="count"></div>
</div>
<script>
let slideMs = 8000;
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
let casting = null, nsid = '', album = null, photos = [], idx = 0, timer = null, statusTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function card(thumb, title, sub, onClick) {
  const b = document.createElement('button');
  b.className = 'card';
  const img = document.createElement('img');
  img.loading = 'lazy'; img.alt = ''; if (thumb) img.src = thumb;
  b.append(img);
  if (title !== null) {
    const d = document.createElement('div');
    d.textContent = title;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; d.append(document.createElement('br'), s); }
    b.append(d);
  } else b.title = sub;
  b.onclick = onClick;
  return b;
}
function message(t) { $('msg').textContent = t; $('msg').hidden = !t; }

async function loadAlbums(user) {
  store.set('user', user);
  album = null; photos = []; updateCastBtn(); $('albumBar').hidden = true;
  $('grid').className = 'grid'; $('grid').replaceChildren();
  message('Loading albums…');
  try {
    const r = await api('/api/albums?user=' + encodeURIComponent(user));
    nsid = r.nsid;
    message(r.albums.length ? '' : 'No public albums.');
    $('grid').replaceChildren(...r.albums.map(a => card(a.thumb, a.title,
      `${a.count} photos · ${new Date(a.created * 1000).toLocaleDateString()}`, () => openAlbum(a))));  } catch (e) { message(e.message); }
}

async function openAlbum(a) {
  album = a; idx = 0;
  $('albumTitle').textContent = a.title; $('albumBar').hidden = false;
  $('grid').className = 'grid photos'; $('grid').replaceChildren();
  message('Loading photos…');
  try {
    photos = await api(`/api/photos?user=${encodeURIComponent(nsid)}&album=${encodeURIComponent(a.id)}`);
    message(photos.length ? '' : 'No photos in this album.');
    $('grid').replaceChildren(...photos.map((p, i) => card(p.thumb, null, p.title, () => view(i))));
    updateCastBtn();
    // Keep casting: a running cast switches to this album on the same device.
    const st = await api('/api/status');
    if (st.active && st.addr && st.album !== a.id && photos.length) cast({ addr: st.addr, name: st.device });
  } catch (e) { message(e.message); }
}

// Usable with an album open (to cast it) or while casting (to stop).
function updateCastBtn() { $('castBtn').disabled = !(album && photos.length) && !casting; }

function view(i) {
  idx = (i + photos.length) % photos.length;
  $('viewer').hidden = false;
  $('big').src = '/img/' + photos[idx].id;
  $('big').alt = photos[idx].title || '';
  $('count').textContent = `${idx + 1} / ${photos.length}`;
}
function setPlaying(on) {
  clearInterval(timer); timer = on ? setInterval(() => view(idx + 1), slideMs) : null;
  $('slide').textContent = on ? '❚❚ Pause' : '▶ Play';
}
function closeViewer() { setPlaying(false); if (fullscreenEl()) exitFullscreen(); $('viewer').hidden = true; }

// Fullscreen, with the webkit-prefixed API for iPad Safari. iPhone Safari has neither, so the button is hidden there.
const fullscreenEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const exitFullscreen = () => (document.exitFullscreen || document.webkitExitFullscreen).call(document);
function toggleFullscreen() {
  const v = $('viewer');
  if (fullscreenEl()) exitFullscreen();
  else (v.requestFullscreen || v.webkitRequestFullscreen).call(v);
}
$('full').hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
for (const ev of ['fullscreenchange', 'webkitfullscreenchange'])
  document.addEventListener(ev, () => { $('full').textContent = fullscreenEl() ? '🗗' : '⛶'; $('full').title = fullscreenEl() ? 'Exit full screen (F)' : 'Full screen (F)'; });

async function openCastMenu() {
  const m = $('menu');
  if (!m.hidden) { m.hidden = true; return; }
  m.hidden = false;
  m.innerHTML = '<p>Searching for Cast devices…</p>';
  const items = [];
  const st = await api('/api/status');
  if (st.active) {
    const stop = document.createElement('button');
    stop.textContent = '■ Stop casting';
    stop.onclick = async () => { m.hidden = true; await api('/api/stop', { method: 'POST' }); pollStatus(); };
    items.push(stop);
  }
  if (!album || !photos.length) {
    const p = document.createElement('p'); p.textContent = 'Open an album to cast it.'; items.push(p);
  } else try {
    const devs = await api('/api/devices');
    if (!devs.length) { const p = document.createElement('p'); p.textContent = 'No Cast devices found.'; items.push(p); }
    for (const d of devs) {
      const b = document.createElement('button');
      b.textContent = '📺 ' + d.name;
      b.onclick = () => cast(d);
      items.push(b);
    }
  } catch (e) { const p = document.createElement('p'); p.textContent = e.message; items.push(p); }
  m.replaceChildren(...items);
}

async function cast(d) {
  $('menu').hidden = true;
  const start = $('viewer').hidden ? 0 : idx;
  const q = new URLSearchParams({ device: d.addr, name: d.name, album: album.id, start });
  try { await api('/api/cast?' + q, { method: 'POST' }); } catch (e) { $('status').textContent = e.message; }
  pollStatus();
}

async function pollStatus() {
  clearTimeout(statusTimer);
  try {
    const s = await api('/api/status');
    $('status').textContent = s.text;
    $('castBtn').classList.toggle('on', s.active);
    casting = s.active ? s : null; updateCastBtn();
    if (s.active) statusTimer = setTimeout(pollStatus, 2000);
  } catch { statusTimer = setTimeout(pollStatus, 5000); }
}

$('userForm').onsubmit = e => { e.preventDefault(); const u = $('user').value.trim(); if (u) loadAlbums(u); };
$('back').onclick = () => loadAlbums(store.get('user') || $('user').value);
$('play').onclick = () => { view(idx); setPlaying(true); };
$('prev').onclick = () => view(idx - 1);
$('next').onclick = () => view(idx + 1);
$('slide').onclick = () => setPlaying(!timer);
$('close').onclick = closeViewer;
$('full').onclick = toggleFullscreen;
$('castBtn').onclick = openCastMenu;
let touchX = null;
$('viewer').addEventListener('touchstart', e => { touchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$('viewer').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) view(idx + (dx < 0 ? 1 : -1));
});
document.onkeydown = e => {
  if ($('viewer').hidden) return;
  if (e.key === 'ArrowRight') view(idx + 1);
  else if (e.key === 'ArrowLeft') view(idx - 1);
  else if (e.key === 'Escape') closeViewer();
  else if (e.key === 'f' && !$('full').hidden) toggleFullscreen();
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!timer); }
};

$('keyForm').onsubmit = async e => {
  e.preventDefault();
  $('keyMsg').textContent = 'Checking key with Flickr…';
  try {
    await api('/api/key?key=' + encodeURIComponent($('key').value.trim()), { method: 'POST' });
    $('keyForm').hidden = true;
    start();
  } catch (err) { $('keyMsg').textContent = err.message; }
};

function showDelay(secs) { slideMs = secs * 1000; $('delay').value = secs; }
$('delay').onchange = async () => {
  try {
    showDelay((await api('/api/settings?slideSecs=' + Math.round(+$('delay').value), { method: 'POST' })).slideSecs);
    if (timer) setPlaying(true);
  } catch (e) { $('status').textContent = e.message; }
};

// Ask for whatever the server is missing before loading albums.
async function start() {
  try {
    const cfg = await api('/api/config');
    showDelay(cfg.slideSecs);
    if (cfg.needKey) {
      $('keyForm').hidden = false; message(''); $('key').focus();
      return;
    }
  } catch (e) { message('Cannot reach the NymFlickrCast server: ' + e.message); return; }
  message('Enter a Flickr username to see the albums.');
  const initial = new URLSearchParams(location.search).get('user') || store.get('user');
  if (initial) { $('user').value = initial; loadAlbums(initial); }
}
start();
pollStatus();
</script>
</body>
</html>
